name: Publish to Comfy Registry

# Runs from the public `comfymobile-link` repo (a copy of companion-node/).
# Bump `version` in pyproject.toml to publish a new release.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'saurabhthesuperhero' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          python -m pip install --quiet pytest aiohttp
          python -m pytest -q tests
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          # Repo Settings > Secrets and variables > Actions > REGISTRY_ACCESS_TOKEN
          # (an API key created at https://registry.comfy.org for publisher "comfymobile").
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
